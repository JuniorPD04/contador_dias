<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

    <!-- viewport-fit=cover: deja que el fondo llegue hasta el notch/home-indicator del iPhone -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1"
    />

    <title>Contando los días hasta verte</title>
    <meta
      name="description"
      content="Cuenta regresiva para nuestro reencuentro."
    />

    <!-- ===================== PWA: iOS (Safari) ===================== -->
    <!-- Habilita el modo "app" al agregar a inicio desde Safari -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- Barra de estado transparente/oscura, va bien con el fondo nocturno de la app -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <!-- Nombre corto que aparece debajo del ícono en la pantalla de inicio -->
    <meta name="apple-mobile-web-app-title" content="Mi amor" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- ===================== PWA: general / Android ===================== -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#150F26" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/icons/favicon-16.png" />

    <!-- ===================== Tipografías ===================== -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Figtree:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-ink-950">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
